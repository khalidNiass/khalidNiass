<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="30" viewBox="0 0 1200 30" role="img" aria-label="Animated electric-blue divider">
  <defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1677FF" stop-opacity="0"/><stop offset=".5" stop-color="#1677FF" stop-opacity=".7"/><stop offset="1" stop-color="#64B5FF" stop-opacity="0"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs>
  <path d="M0 15H1200" stroke="url(#line)" stroke-width="1"/>
  <circle cy="15" r="5" fill="#64B5FF" opacity=".72" filter="url(#glow)"><animate attributeName="cx" values="0;1200;0" dur="24s" repeatCount="indefinite"/></circle>
  <circle cy="15" r="2" fill="#D9F0FF"><animate attributeName="cx" values="0;1200;0" dur="24s" repeatCount="indefinite"/></circle>
</svg>