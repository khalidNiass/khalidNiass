<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Khalid Niass — Full-Stack Software Engineer</title>
  <desc id="desc">A cinematic obsidian and electric-blue developer banner for Lagos-based engineer Khalid Niass.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070B"/><stop offset=".58" stop-color="#090F1C"/><stop offset="1" stop-color="#07152B"/></linearGradient>
    <radialGradient id="blueGlow"><stop stop-color="#1677FF" stop-opacity=".55"/><stop offset="1" stop-color="#1677FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="iceGlow"><stop stop-color="#64B5FF" stop-opacity=".28"/><stop offset="1" stop-color="#64B5FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#64B5FF" stop-opacity="0"/><stop offset=".5" stop-color="#64B5FF" stop-opacity=".8"/><stop offset="1" stop-color="#1677FF" stop-opacity="0"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1677FF" stop-opacity="0"/><stop offset=".5" stop-color="#64B5FF" stop-opacity=".9"/><stop offset="1" stop-color="#1677FF" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#64B5FF" stroke-opacity=".075" stroke-width="1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="clip"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#base)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <ellipse cx="900" cy="180" rx="300" ry="220" fill="url(#blueGlow)" filter="url(#blur)"><animate attributeName="cx" values="860;1010;860" dur="26s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="1050" cy="90" rx="180" ry="130" fill="url(#iceGlow)" filter="url(#blur)"><animate attributeName="cy" values="90;240;90" dur="31s" repeatCount="indefinite"/></ellipse>
    <path d="M650 380 930 0M770 380 1050 0M890 380 1170 0M1010 380 1290 0" stroke="#64B5FF" stroke-opacity=".12"/>
    <path d="M640 285C790 260 780 115 960 110S1110 170 1240 85" fill="none" stroke="#1677FF" stroke-opacity=".34" stroke-width="1.5"/>
    <path d="M650 305C800 280 800 135 970 130S1110 190 1230 105" fill="none" stroke="#64B5FF" stroke-opacity=".16"/>
    <g fill="#9BD2FF">
      <circle cx="824" cy="212" r="2.5"><animate attributeName="opacity" values=".25;1;.25" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="914" cy="119" r="2"><animate attributeName="opacity" values="1;.2;1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1044" cy="228" r="2.5"><animate attributeName="opacity" values=".2;.9;.2" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="81" r="1.8"><animate attributeName="opacity" values=".3;1;.3" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="742" cy="101" r="1.8"><animate attributeName="opacity" values="1;.25;1" dur="5.6s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="294" r="2"><animate attributeName="opacity" values=".2;.8;.2" dur="5.2s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="skewX(-18)" opacity=".55"><rect x="-220" y="0" width="110" height="380" fill="url(#streak)"><animateTransform attributeName="transform" type="translate" values="-450 0;1650 0" dur="22s" repeatCount="indefinite"/></rect></g>
    <circle cx="990" cy="183" r="92" fill="none" stroke="#64B5FF" stroke-opacity=".12"/>
    <circle cx="990" cy="183" r="130" fill="none" stroke="#64B5FF" stroke-opacity=".07"/>
    <circle cx="990" cy="183" r="4" fill="#64B5FF" filter="url(#softGlow)"/>
    <path d="M70 72H160" stroke="url(#edge)" stroke-width="2"/>
    <text x="70" y="151" fill="#F5F7FA" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="3">KHALID NIASS</text>
    <text x="74" y="196" fill="#64B5FF" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="4">FULL-STACK SOFTWARE ENGINEER</text>
    <text x="74" y="250" fill="#C3CBD8" font-family="Segoe UI,Arial,sans-serif" font-size="17">Building useful digital products, from interface to infrastructure.</text>
    <circle cx="78" cy="308" r="3" fill="#64B5FF"/>
    <text x="91" y="313" fill="#929BAC" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2.2">LAGOS, NIGERIA</text>
    <path d="M70 337H1130" stroke="#64B5FF" stroke-opacity=".17"/>
    <rect x="70" y="336" width="1060" height="1" fill="url(#edge)"/>
  </g>
</svg>